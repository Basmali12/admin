<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <h1>إضافة منتج جديد</h1>
        <form id="productForm">
            <input type="text" id="productName" placeholder="اسم المنتج" required>
            <input type="number" id="productPrice" placeholder="السعر" required>
            <input type="file" id="productImage" accept="image/*" required>
            <img id="imagePreview" src="" style="display: none; width: 100%; max-width: 200px; margin-top: 10px;">
            <button type="submit" id="submitBtn">حفظ المنتج</button>
        </form>

        <h2>المنتجات الحالية</h2>
        <div id="productsList"></div>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
